{{define "content"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Event.Name}} projects</title>
<style>
body{margin:0;font:14px/1.45 system-ui,sans-serif;color:#16181d;background:transparent}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));padding:4px}
.c{border:1px solid #e2e3de;border-radius:8px;padding:10px 12px;background:#fff}
.c a{color:#16181d;font-weight:600;text-decoration:none}.c a:hover{color:#1f6f5c}
.m{color:#5d6470;font-size:12px}.f{font-size:11px;color:#5d6470;padding:6px 4px}.f a{color:#1f6f5c}
@media (prefers-color-scheme:dark){body{color:#e8e9ec}.c{background:#181b21;border-color:#2a2e36}.c a{color:#e8e9ec}}
</style></head><body>
<div class="g">
{{range .Page.Projects}}<div class="c"><a href="{{$.Base}}/p/{{.ID}}" target="_blank" rel="noopener">{{.Title}}</a><div class="m">{{.TeamName}}{{if .TrackName}} · {{.TrackName}}{{end}}</div></div>{{end}}
</div>
<div class="f">{{.Page.Total}} projects from <a href="{{.Base}}/events/{{.Event.Slug}}" target="_blank" rel="noopener">{{.Event.Name}}</a></div>
</body></html>{{end}}

{{define "content"}}
<h1>New event</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/organize/new" class="stack">
  {{template "csrf" .CSRF}}
  <label>Name<input type="text" name="name" maxlength="120" required value="{{with .Form}}{{.Get "name"}}{{end}}"></label>
  <label>Slug <span class="hint">Used in URLs. Leave empty to derive from the name.</span><input type="text" name="slug" pattern="[a-z0-9][a-z0-9-]{1,62}" value="{{with .Form}}{{.Get "slug"}}{{end}}"></label>
  <label>Description<textarea name="description">{{with .Form}}{{.Get "description"}}{{end}}</textarea></label>
  <div class="row">
    <label>Submissions open (UTC)<input type="datetime-local" name="submissions_open_at" value="{{.Open}}" required></label>
    <label>Submissions close (UTC)<input type="datetime-local" name="submissions_close_at" value="{{.Close}}" required></label>
  </div>
  <label>Judging closes (UTC) <span class="hint">Optional. Leave empty to close judging by publishing results.</span><input type="datetime-local" name="judging_close_at"></label>
  <div class="row">
    <label>Community voting opens<input type="datetime-local" name="voting_open_at"></label>
    <label>Community voting closes<input type="datetime-local" name="voting_close_at"></label>
  </div>
  <div class="row">
    <label>Reviews per project<input type="number" name="reviews_per_project" value="3" min="1" max="20"></label>
    <label>Max team size<input type="number" name="max_team_size" value="4" min="1" max="50"></label>
    <label>Votes per voter<input type="number" name="votes_per_voter" value="3" min="1" max="50"></label>
  </div>
  <label>Tracks <span class="hint">One per line.</span><textarea name="tracks" rows="4">{{with .Form}}{{.Get "tracks"}}{{end}}</textarea></label>
  <label>Judging criteria <span class="hint">One per line, equal weight to start; re-weight in settings. Defaults to Functionality, Quality, Innovation.</span><textarea name="criteria" rows="3">{{with .Form}}{{.Get "criteria"}}{{end}}</textarea></label>
  <label class="row"><span><input type="checkbox" name="is_public" value="1" checked> Public (listed, gallery visible to visitors)</span></label>
  <div><button>Create event</button></div>
</form>
{{end}}

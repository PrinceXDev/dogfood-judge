{{define "content"}}
<h1>Join {{.Team.Name}}</h1>
<p>{{.Event.Name}} · {{len .Team.Members}} of {{.Event.MaxTeamSize}} members</p>
<p class="small muted">{{range .Team.Members}}{{.Name}} · {{end}}</p>
{{if .Me}}
<form method="post" action="/join/{{.Token}}">
  {{template "csrf" .CSRF}}
  <button>Join team</button>
</form>
{{else}}
<p><a class="btn" href="/signup?next=/join/{{.Token}}">Create an account</a> or <a href="/login?next=/join/{{.Token}}">sign in</a> to join.</p>
{{end}}
{{end}}

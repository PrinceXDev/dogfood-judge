{{define "content"}}
<h1>You're invited to {{.Event.Name}}</h1>
<p>Role: <b>{{.Invitation.Role}}</b>{{if .Invitation.Email}} · for {{.Invitation.Email}}{{end}} · expires {{date .Invitation.ExpiresAt}}</p>
{{if .Me}}
<form method="post" action="/invite/{{.Token}}">
  {{template "csrf" .CSRF}}
  <button>Accept as {{.Me.Name}}</button>
</form>
{{else}}
<p><a class="btn" href="/signup?next=/invite/{{.Token}}">Create an account</a> or <a href="/login?next=/invite/{{.Token}}">sign in</a> to accept.</p>
{{end}}
{{end}}

{{define "content"}}
<h1>Sign in</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="next" value="{{.Next}}">
  <label>Email<input type="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <div><button>Sign in</button></div>
</form>
<p class="muted small">No account? <a href="/signup?next={{.Next}}">Create one</a>. Imported as a judge or participant? Ask an organizer for your activation link.</p>
{{end}}
